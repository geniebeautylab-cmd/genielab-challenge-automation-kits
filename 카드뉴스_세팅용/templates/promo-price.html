<div class="card promo-price">
  <div class="handle">{{HANDLE}}</div>
  <div class="promo-tag">{{TAG}}</div>
  <div class="title">{{TITLE}}</div>
  <div class="tiers">
    <div class="tier">
      <div class="tier-name">{{TIER1_NAME}}</div>
      <div class="tier-price">{{TIER1_PRICE}}</div>
      <div class="tier-note">{{TIER1_NOTE}}</div>
    </div>
    <div class="tier tier-mid">
      <div class="tier-name">{{TIER2_NAME}}</div>
      <div class="tier-price">{{TIER2_PRICE}}</div>
      <div class="tier-note">{{TIER2_NOTE}}</div>
    </div>
    <div class="tier tier-vip">
      <div class="tier-name">{{TIER3_NAME}}</div>
      <div class="tier-price">{{TIER3_PRICE}}</div>
      <div class="tier-note">{{TIER3_NOTE}}</div>
    </div>
  </div>
  <div class="footer">
    <span class="brand">{{HANDLE}}</span>
    <span class="page">{{PAGE}}</span>
  </div>
</div>
